version: '3.8'

services:
  facemask-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: facemask-detection:1.0.0
    container_name: facemask_detection_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
